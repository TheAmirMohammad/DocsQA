services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: docsqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docsqa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docsqa"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docsqa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    image: docsqa-app:latest
    container_name: docsqa-api
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed_docs.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/docsqa
      - REDIS_URL=redis://redis:6379/0
      - MODEL_PROVIDER=stub
      - LOG_LEVEL=INFO
      - SAMPLE_DOCS_PATH=./sample_docs/fastapi_tutorial
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  worker:
    build: .
    image: docsqa-app:latest
    container_name: docsqa-worker
    restart: unless-stopped
    command: ["arq", "app.worker.tasks.WorkerSettings"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/docsqa
      - REDIS_URL=redis://redis:6379/0
      - MODEL_PROVIDER=stub
      - LOG_LEVEL=INFO
      - SAMPLE_DOCS_PATH=./sample_docs/fastapi_tutorial
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: docsqa-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.0.0
    container_name: docsqa-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
