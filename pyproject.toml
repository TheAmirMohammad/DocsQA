[project]
name = "docsqa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "arq>=0.26.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pgvector>=0.3.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "structlog>=24.1.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "mypy>=2.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
    "B008",     # FastAPI Depends in function defaults
    "BLE001",   # blind exception catch
    "S110",     # try-except-pass
    "ASYNC230", # blocking file open in ingestion CLI
    "TRY201",   # raise e instead of bare raise
    "RUF012",   # mutable class attribute in pydantic/arq
    "PLR1722",  # exit vs sys.exit
]

[tool.mypy]
files = ["app", "evals"]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
